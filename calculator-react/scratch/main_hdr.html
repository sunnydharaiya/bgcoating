<header class="apphead">
      <button class="icon-btn burger" onclick="document.getElementById(&#39;app&#39;).classList.toggle(&#39;sb-open&#39;)" aria-label="Open navigation">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      </button>
      <button class="icon-btn sb-toggle" onclick="toggleSidebar()" title="Hide / show sidebar" aria-label="Hide or show sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path><path class="tg-arr" d="M13.5 9.5 16 12l-2.5 2.5"></path></svg>
      </button>
      <div class="crumb">
        <button class="plat-name" onclick="go(&#39;dashboard&#39;)" title="Complete Coating &amp; Corrosion Management Ecosystem — go to Home">Complete Coating &amp; Corrosion Management Ecosystem</button>
      </div>
      <div class="head-spacer"></div>
      <div class="zoomer" title="Interface zoom (default 90%)">
        <button onclick="setZoom(-5)" aria-label="Zoom out">−</button>
        <span class="zval" id="zoomVal" onclick="setZoom(0)" title="Click to reset to 90%">90%</span>
        <button onclick="setZoom(5)" aria-label="Zoom in">+</button>
      </div>
      <button class="plan-pill" id="headPlanPill" onclick="openUpgrade()" title="View plans &amp; subscription"><i class="badge-dot"></i>Free Plan</button>
      <button class="btn btn-primary btn-sm" onclick="openUpgrade()">Upgrade <span class="arr">→</span></button>
      <div class="head-wrap">
        <button class="icon-btn" onclick="toggleDD(&#39;dd-userTop&#39;)" aria-label="Account menu">
          <div class="avatar" id="hdAvatar" style="width:30px;height:30px;font-size:.72rem">U</div>
        </button>
        <div class="dd" id="dd-userTop">
          <div class="dd-head" id="ddEmail2">Not signed in<span id="ddPlanLine2">Free plan · Personal workspace</span></div>
          <div class="dd-body">
            <button class="dd-item acct-item" onclick="openAuth(&#39;login&#39;)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><path d="m10 17 5-5-5-5M15 12H3"></path></svg>Sign In / Register</button>
          <button class="dd-item" onclick="openUpgrade()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M2 10h20"></path></svg>Subscription &amp; Plans</button>
          <button class="dd-item" onclick="go(&#39;settings&#39;)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2-1.2L14 3h-4l-.5 2.6a7 7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.6A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2 1.2L10 21h4l.5-2.6a7 7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"></path></svg>Profile &amp; Settings</button>
            <button class="dd-item acct-out" onclick="logout()" hidden=""><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><path d="m16 17 5-5-5-5M21 12H9"></path></svg>Sign Out</button>
          </div>
        </div>
      </div>
    </header>
