<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-2.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BG CoatingOS™ — Digital Workspace & Coating Calculator SPA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Rajdhani:wght@500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
    <script>
      (function() {
        var envStoreUrl = "%VITE_STORE_URL%";
        if (typeof envStoreUrl === 'string' && ((envStoreUrl.startsWith('%') && envStoreUrl.endsWith('%')) || envStoreUrl === 'undefined')) {
          envStoreUrl = (typeof process !== 'undefined' && process.env && process.env.VITE_STORE_URL) || '';
        }

        var envApiUrl = "%VITE_API_URL%";
        if (typeof envApiUrl === 'string' && ((envApiUrl.startsWith('%') && envApiUrl.endsWith('%')) || envApiUrl === 'undefined')) {
          envApiUrl = (typeof process !== 'undefined' && process.env && process.env.VITE_API_URL) || '';
        }

        window.__ENV__ = Object.freeze({
          STORE_URL: envStoreUrl,
          API_URL: envApiUrl
        });

        window.CONFIG = Object.freeze({
          url: window.__ENV__.STORE_URL || window.__ENV__.API_URL || '',
          storeUrl: window.__ENV__.STORE_URL,
          apiUrl: window.__ENV__.API_URL
        });
      })();
    </script>
  </head>
  <body class="bg-[#F3F5F8] text-[#1B222C] antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
