<!-- ======================= STATS GRID COMPONENT ======================= -->
<section class="stats grid-bg" id="sec-stats">
  <div class="wrap">
    <div class="stats-grid">
      <div class="stat glass rv">
        <div class="n"><span data-count="{{ site_settings.years_experience|default:'22' }}">22</span><em>+</em></div>
        <div class="l">Years Hands-On Experience</div>
      </div>
      <div class="stat glass rv rv-d1">
        <div class="n"><span data-count="{{ site_settings.total_enquiries|default:'5355' }}">{{ site_settings.enquiries_count|default:'5,355' }}</span><em>+</em></div>
        <div class="l">Projects &amp; Enquiries Delivered</div>
      </div>
      <div class="stat glass rv rv-d2">
        <div class="n"><span data-count="{{ site_settings.unique_visitors|default:'37617' }}">{{ site_settings.unique_visitors_count|default:'37,617' }}</span><em>+</em></div>
        <div class="l">SQM/M Platform Coverage</div>
      </div>
      <div class="stat glass rv rv-d3">
        <div class="n"><span data-count="{{ site_settings.specialized_verticals_count|default:'12' }}">12</span></div>
        <div class="l">Specialized Service Verticals</div>
      </div>
    </div>
  </div>
</section>
