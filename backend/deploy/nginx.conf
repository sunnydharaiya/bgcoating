# ==============================================================================
# Nginx Reverse Proxy Configuration for BG Coating Backend (Gunicorn)
# ==============================================================================
# Place in: /etc/nginx/sites-available/bgcoating-backend
# Symlink to: /etc/nginx/sites-enabled/
# Test: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name api.yourdomain.com; # Replace with your VPS domain or IP

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;

    # Static Files (Collected via python manage.py collectstatic)
    location /static/ {
        alias /var/www/bgcoating.com/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Media Files (Uploaded assets, certificates, etc.)
    location /media/ {
        alias /var/www/bgcoating.com/backend/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # API and Django Admin Proxy to Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cloudflare header forwarding if behind Cloudflare DNS
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
